<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
@font-face{font-family:"Pretendard Variable";src:url(../images/PretendardVariable.woff2) format("woff2");font-weight:45 920;font-display:swap}
body{margin:0;background:#F7F3FA}
*{box-sizing:border-box}
a{color:#7C429A;text-decoration:none}a:hover{color:#5E2F78}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:9999px;background:#F3EAF8;color:#5E2F78;font-size:12px;font-weight:600;white-space:nowrap}
.num{display:inline-flex;align-items:center;justify-content:center;border-radius:9999px;background:#C2255C;color:#FFFFFF;font-weight:800;letter-spacing:-0.02em}
.card{background:#FFFFFF;border:1px solid #E7E1EC;border-radius:16px}
.sec{display:flex;align-items:center;justify-content:space-between;padding:0 16px;margin:0 0 12px}
.sec h2{margin:0;font-size:20px;line-height:28px;font-weight:700;color:#2A1F33}
.more{display:inline-flex;align-items:center;gap:2px;font-size:13px;font-weight:600;color:#6B6175}
.price{font-size:18px;line-height:24px;font-weight:800;color:#C2255C}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 18px;border-radius:9999px;background:#7C429A;color:#FFFFFF;font-size:14px;font-weight:700;border:0;font-family:inherit;white-space:nowrap}
.ph{background:#F3EAF8;display:flex;align-items:center;justify-content:center}

</style></head><body>
<div style="position: relative; width: 390px; height: 900px; overflow: hidden; background: #F7F3FA; font-family: 'Pretendard Variable', Pretendard, system-ui, sans-serif; color: #2A1F33;">
<header style="display: flex; align-items: center; gap: 4px; height: 56px; padding: 0 8px; background: #FFFFFF; border-bottom: 1px solid #E7E1EC;">
<a href="Main.dc.html" aria-label="뒤로" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; color: #2A1F33;"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 24px; height: 24px;"><path d="m15 18-6-6 6-6"/></svg></a>
<div style="font-size: 17px; font-weight: 700;">로그인</div></header>
<main style="padding: 28px 20px 96px; display: flex; flex-direction: column; gap: 24px;">
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;">
<img src="../images/logo-angel-mark.png" alt="" style="width: 92px;">
<h1 style="margin: 0; font-size: 24px; line-height: 32px; font-weight: 800;">다시 오셨네요</h1>
<p style="margin: 0; font-size: 14px; line-height: 21px; color: #6B6175;">로그인하면 예약·상담 내역과 주문을<br>한곳에서 볼 수 있어요.</p>
</div>
<form style="display: flex; flex-direction: column; gap: 16px;">
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="le" style="font-size: 14px; font-weight: 700;">이메일</label>
<div style="position: relative;"><span style="position: absolute; left: 14px; top: 14px; color: #6B6175;"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 20px; height: 20px;"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span><input id="le" type="email" placeholder="example@email.com" style="width: 100%; height: 52px; padding: 0 14px 0 44px; border: 1px solid #E7E1EC; border-radius: 8px; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #2A1F33;"></div></div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="lp" style="font-size: 14px; font-weight: 700;">비밀번호</label>

<button type="button" class="btn" style="height: 52px; width: 100%; font-size: 16px; margin-top: 4px;">로그인</button>
<div style="display: flex; justify-content: center; gap: 16px; font-size: 14px; font-weight: 600;"><a href="Forgot.dc.html" style="color: #6B6175;">비밀번호 재설정</a><span style="color: #E7E1EC;">|</span><a href="Signup.dc.html">회원가입</a></div>
</form>
<section style="padding: 16px; border-radius: 16px; background: #F3EAF8; display: flex; flex-direction: column; gap: 10px;">
<div style="font-size: 15px; font-weight: 800; color: #5E2F78;">회원이 아니어도 괜찮아요</div>
<div style="font-size: 13px; line-height: 19px; color: #5E2F78;">전화상담은 로그인 없이 예약할 수 있어요. 예약 내역은 예약번호로 조회해요.</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
<a href="Consult.dc.html" class="btn"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px;"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>비회원 예약</a>
<a href="Lookup.dc.html" class="btn" style="background: #FFFFFF; color: #7C429A; border: 1px solid #7C429A;"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px;"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>예약 조회</a>
</div></section>
</main>

<a href="Lookup.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: 64px; color: #6B6175; font-size: 12px; font-weight: 600;"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 24px; height: 24px;"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span>예약조회</span></a><a href="Login.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: 64px; color: #7C429A; font-size: 12px; font-weight: 700;"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 24px; height: 24px;"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg><span>로그인</span></a>
