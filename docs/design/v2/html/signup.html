<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
@font-face{font-family:"Pretendard Variable";src:url(../images/PretendardVariable.woff2) format("woff2");font-weight:45 920;font-display:swap}
body{margin:0;background:#F7F3FA}
*{box-sizing:border-box}
a{color:#7C429A;text-decoration:none}a:hover{color:#5E2F78}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:9999px;background:#F3EAF8;color:#5E2F78;font-size:12px;font-weight:600;white-space:nowrap}
.num{display:inline-flex;align-items:center;justify-content:center;border-radius:9999px;background:#C2255C;color:#FFFFFF;font-weight:800;letter-spacing:-0.02em}
.card{background:#FFFFFF;border:1px solid #E7E1EC;border-radius:16px}
.sec{display:flex;align-items:center;justify-content:space-between;padding:0 16px;margin:0 0 12px}
.sec h2{margin:0;font-size:20px;line-height:28px;font-weight:700;color:#2A1F33}
.more{display:inline-flex;align-items:center;gap:2px;font-size:13px;font-weight:600;color:#6B6175}
.price{font-size:18px;line-height:24px;font-weight:800;color:#C2255C}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 18px;border-radius:9999px;background:#7C429A;color:#FFFFFF;font-size:14px;font-weight:700;border:0;font-family:inherit;white-space:nowrap}
.ph{background:#F3EAF8;display:flex;align-items:center;justify-content:center}

</style></head><body>
<div style="position: relative; width: 390px; height: 960px; overflow: hidden; background: #F7F3FA; font-family: 'Pretendard Variable', Pretendard, system-ui, sans-serif; color: #2A1F33;">
<header style="display: flex; align-items: center; gap: 4px; height: 56px; padding: 0 8px; background: #FFFFFF; border-bottom: 1px solid #E7E1EC;">
<a href="Login.dc.html" aria-label="뒤로" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; color: #2A1F33;"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 24px; height: 24px;"><path d="m15 18-6-6 6-6"/></svg></a>
<div style="font-size: 17px; font-weight: 700;">회원가입</div></header>
<main style="padding: 24px 20px 96px; display: flex; flex-direction: column; gap: 20px;">
<div>
<h1 style="margin: 0; font-size: 24px; line-height: 32px; font-weight: 800;">쪽집게천사 회원가입</h1>
<p style="margin: 6px 0 0; font-size: 14px; line-height: 21px; color: #6B6175;">가입하면 메일로 인증 링크를 보내 드려요.<br>인증을 마친 뒤에 로그인할 수 있어요.</p>
</div>
<form style="display: flex; flex-direction: column; gap: 16px;">
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="sn" style="font-size: 14px; font-weight: 700;">이름</label>
<div style="position: relative;"><input id="sn" type="text" placeholder="홍길동" style="width: 100%; height: 52px; padding: 0 14px 0 14px; border: 1px solid #E7E1EC; border-radius: 8px; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #2A1F33;"></div></div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="se" style="font-size: 14px; font-weight: 700;">이메일</label>
<div style="position: relative;"><input id="se" type="email" placeholder="example@email.com" style="width: 100%; height: 52px; padding: 0 14px 0 14px; border: 1px solid #E7E1EC; border-radius: 8px; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #2A1F33;"></div><div style="font-size: 12px; line-height: 18px; color: #6B6175;">인증 메일을 받을 주소예요.</div></div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="sp" style="font-size: 14px; font-weight: 700;">비밀번호</label>
<div style="position: relative;"><input id="sp" type="password" placeholder="비밀번호" style="width: 100%; height: 52px; padding: 0 72px 0 14px; border: 1px solid #E7E1EC; border-radius: 8px; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #2A1F33;"><button type="button" style="position: absolute; right: 6px; top: 6px; height: 40px; padding: 0 12px; border: 0; background: transparent; color: #7C429A; font-family: inherit; font-size: 13px; font-weight: 700;">표시</button></div></div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="sp2" style="font-size: 14px; font-weight: 700;">비밀번호 확인</label>
<div style="position: relative;"><input id="sp2" type="password" placeholder="비밀번호를 한 번 더" style="width: 100%; height: 52px; padding: 0 72px 0 14px; border: 1px solid #E7E1EC; border-radius: 8px; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #2A1F33;"><button type="button" style="position: absolute; right: 6px; top: 6px; height: 40px; padding: 0 12px; border: 0; background: transparent; color: #7C429A; font-family: inherit; font-size: 13px; font-weight: 700;">표시</button></div></div>
<div class="card" style="padding: 8px 14px; display: flex; flex-direction: column;">
<label style="display: flex; align-items: center; gap: 10px; min-height: 36px; font-size: 15px; font-weight: 800;"><span style="display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 6px; border: 2px solid #B9B0C2; background: #FFFFFF; color: #FFFFFF; flex-shrink: 0;"></span><span>전체 동의</span></label>
<div style="height: 1px; background: #E7E1EC; margin: 4px 0;"></div>
<label style="display: flex; align-items: center; gap: 10px; min-height: 36px; font-size: 14px; font-weight: 500;"><span style="display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 6px; border: 2px solid #B9B0C2; background: #FFFFFF; color: #FFFFFF; flex-shrink: 0;"></span><span><span style="color: #C2255C; font-weight: 700;">(필수)</span> 이용약관</span><span style="margin-left: auto; font-size: 13px; color: #6B6175; text-decoration: underline;">보기</span></label>
<label style="display: flex; align-items: center; gap: 10px; min-height: 36px; font-size: 14px; font-weight: 500;"><span style="display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 6px; border: 2px solid #B9B0C2; background: #FFFFFF; color: #FFFFFF; flex-shrink: 0;"></span><span><span style="color: #C2255C; font-weight: 700;">(필수)</span> 개인정보 수집·이용</span><span style="margin-left: auto; font-size: 13px; color: #6B6175; text-decoration: underline;">보기</span></label>
</div>
<button type="button" class="btn" style="height: 52px; width: 100%; font-size: 16px;">가입하고 인증 메일 받기</button>
<div style="text-align: center; font-size: 14px; color: #6B6175;">이미 회원이신가요? <a href="Login.dc.html" style="font-weight: 700;">로그인</a></div>
</form>
</main>

<a href="Consult.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 4px; color: #7C429A; font-size: 12px; font-weight: 700;"><span style="display: flex; align-items: center; justify-content: center; width: 54px; height: 54px; margin-top: -20px; border-radius: 9999px; background: #7C429A; color: #FFFFFF; border: 4px solid #FFFFFF;"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 24px; height: 24px;"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg></span><span>전화하기</span></a>
<a href="Lookup.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: 64px; color: #6B6175; font-size: 12px; font-weight: 600;"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 24px; height: 24px;"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span>예약조회</span></a><a href="Login.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: 64px; color: #7C429A; font-size: 12px; font-weight: 700;"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 24px; height: 24px;"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg><span>로그인</span></a>
</nav>
</div>
</body></html>
